async function loadData(){try{const [s,c,m]=await Promise.all([api('/rest/v1/shop_info?id=eq.default&select=*',{auth:false}),api('/rest/v1/categories?select=*&order=sort_order.asc',{auth:false}),api('/rest/v1/menu_items?select=*&order=sort_order.asc',{auth:false})]);if(s?.[0])data.shop={name:s[0].name,description:s[0].description,hours:s[0].hours,notes:s[0].notes,announcement:s[0].announcement};if(c?.length)data.categories=c.map(x=>({id:x.id,name:x.name,sortOrder:x.sort_order}));if(m?.length)data.items=m.map(x=>({id:x.id,categoryId:x.category_id,name:x.name,description:x.description,price:x.price,imageUrl:x.image_url,isVisible:x.is_visible,isSoldOut:x.is_sold_out,sortOrder:x.sort_order}));}catch(e){console.warn('menu data load failed',e);toast('メニューの最新情報を取得できませんでした。通信状況をご確認ください。');}}
function publicView(){
  const cats=[...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder);
  const alcoholIds=['cat-cocktail','cat-chuhai','cat-whisky','cat-brandy','cat-shot'];
  const flavorIds=['cat-flavor-fruits','cat-flavor-sweets','cat-flavor-botanical','cat-flavor-spice','cat-flavor-darkleaf','cat-flavor-others'];
  const nonNicotineIds=['cat-nn-fruits','cat-nn-sweets','cat-nn-others'];
  const mainTabs=[
    {id:'main-system',name:'システム'},
    {id:'main-drink',name:'ドリンク'},
    {id:'main-shisha',name:'シーシャ'}
  ];
  const subTabs={
    'main-system':[],
    'main-drink':[
      {id:'drink-alcohol',name:'アルコール'},
      {id:'drink-soft',name:'ソフトドリンク'},
      {id:'drink-other',name:'Otherドリンク'},
      {id:'drink-champagne',name:'シャンパン'}
    ],
    'main-shisha':[
      {id:'shisha-nicotine',name:'ニコチン'},
      {id:'shisha-nonnicotine',name:'ノンニコチン'}
    ]
  };
  if(!mainTabs.some(x=>x.id===activeMain))activeMain='main-system';
  if(activeMain==='main-system') activeSub='';
  else if(!(subTabs[activeMain]||[]).some(x=>x.id===activeSub))activeSub=(subTabs[activeMain]||[])[0]?.id||'';

  const card=i=>`<article class="card"><div class="row"><div class="name">${esc(i.name)}${i.isSoldOut?'<span class="sold">売り切れ</span>':''}</div>${Number(i.price)>0?`<div class="price">${yen(i.price)}</div>`:''}</div>${i.description?`<div class="desc">${esc(i.description)}</div>`:''}</article>`;
  const flavorItem=i=>`<div class="flavor-item">${esc(i.name)}${i.isSoldOut?'<span class="sold">売り切れ</span>':''}</div>`;
  const section=(id,label,compact=false)=>{
    const c=cats.find(x=>x.id===id); if(!c)return '';
    const items=data.items.filter(i=>i.categoryId===id&&i.isVisible).sort((a,b)=>a.sortOrder-b.sortOrder); if(!items.length)return '';
    return `<h2 class="section-title">${esc(label||c.name)}</h2>${compact?`<section class="flavor-grid">${items.map(flavorItem).join('')}</section>`:`<section>${items.map(card).join('')}</section>`}`;
  };

  let content='';
  if(activeMain==='main-system'){
    content=[section('cat-system','SYSTEM'),section('cat-shisha','Shisha'),section('cat-option','Option')].join('');
    if(!content)content='<div class="empty">このメニューは準備中です。</div>';
  }else if(activeMain==='main-drink'){
    if(activeSub==='drink-alcohol') content=alcoholIds.map(id=>section(id)).join('');
    if(activeSub==='drink-soft') content=section('cat-soft-drink','ソフトドリンク');
    if(activeSub==='drink-other') content=section('cat-other-drink','Otherドリンク');
    if(activeSub==='drink-champagne') content=section('cat-champagne','シャンパン');
    if(!content)content='<div class="empty">ドリンクメニューは準備中です。</div>';
  }else if(activeMain==='main-shisha'){
    const labels={
      'cat-flavor-fruits':'FRUITS','cat-flavor-sweets':'SWEETS','cat-flavor-botanical':'BOTANICAL&TEA','cat-flavor-spice':'SPICE&OTHERS','cat-flavor-darkleaf':'DARK LEAF','cat-flavor-others':'OTHERS',
      'cat-nn-fruits':'FRUITS','cat-nn-sweets':'SWEETS','cat-nn-others':'OTHERS'
    };
    if(activeSub==='shisha-nicotine') content=flavorIds.map(id=>section(id,labels[id],true)).join('');
    if(activeSub==='shisha-nonnicotine') content=nonNicotineIds.map(id=>section(id,labels[id],true)).join('');
    if(!content)content='<div class="empty">シーシャフレーバーは準備中です。</div>';
  }

  const sub=(subTabs[activeMain]||[]);
  app.innerHTML=`<div class="wrap"><div class="frame"><section class="hero"><div class="eyebrow">MENU</div><h1>${esc(data.shop.name)}</h1><div class="hours">open ${esc((data.shop.hours||'').split('-')[0]?.trim()||'19:00')}<br>close ${esc((data.shop.hours||'').split('-')[1]?.trim()||'5:00')}</div>${data.shop.description?`<div class="shop-description">${esc(data.shop.description)}</div>`:''}${data.shop.announcement?`<div class="notice">${esc(data.shop.announcement)}</div>`:''}</section></div><nav class="tabs">${mainTabs.map(t=>`<button class="tab ${t.id===activeMain?'active':''}" data-main="${t.id}">${t.name}</button>`).join('')}</nav>${sub.length?`<nav class="subtabs">${sub.map(t=>`<button class="subtab ${t.id===activeSub?'active':''}" data-sub="${t.id}">${t.name}</button>`).join('')}</nav>`:''}${content}<footer class="footer">${esc(data.shop.notes||'tax10%頂戴しております。')}<br><br><a href="?admin=1" style="color:#777;text-decoration:none;font-size:10px">STAFF</a></footer></div>`;
  document.querySelectorAll('[data-main]').forEach(b=>b.onclick=()=>{activeMain=b.dataset.main;activeSub=activeMain==='main-system'?'':((subTabs[activeMain]||[])[0]?.id||'');publicView()});
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{activeSub=b.dataset.sub;publicView()});
}
const STAFF_AUTH_DOMAIN='queen-staff.invalid';
function normalizeStaffLoginId(v){return String(v||'').normalize('NFKC').trim().toLowerCase()}
function validStaffLoginId(v){const id=normalizeStaffLoginId(v);return id.length>=3&&id.length<=30&&!/\s/.test(id)}
function staffIdKey(v){const id=normalizeStaffLoginId(v);const bytes=new TextEncoder().encode(id);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function staffEmailFromId(v){return `u_${staffIdKey(v)}@${STAFF_AUTH_DOMAIN}`}
function uniqueStaffEmailFromId(v){const a=new Uint32Array(2);crypto.getRandomValues(a);return `u_${staffIdKey(v)}_${Date.now().toString(36)}_${a[0].toString(36)}${a[1].toString(36)}@${STAFF_AUTH_DOMAIN}`}
function isInternalStaffEmail(v){return String(v||'').toLowerCase().endsWith('@'+STAFF_AUTH_DOMAIN)}
function staffLoginIdOf(user){const meta=user?.user_metadata||{};return meta.staff_login_id?String(meta.staff_login_id):''}
function authErrorJa(err,fallback='処理に失敗しました。'){
  let msg=err?.message||'';
  try{const j=JSON.parse(msg);msg=j.msg||j.message||j.error_description||j.error||msg}catch{}
  const s=String(msg||'').toLowerCase();
  if(s.includes('invalid login credentials'))return 'ユーザーIDまたはパスワードが違います。';
  if(s.includes('email not confirmed'))return 'このアカウントはまだ利用できません。管理者に確認してください。';
  if(s.includes('user already registered')||s.includes('already registered'))return 'このユーザーIDはすでに使用されています。別のユーザーIDにしてください。';
  if(s.includes('password is known to be weak')||s.includes('weak and easy to guess'))return 'このパスワードは推測されやすいため使用できません。英字・数字・記号を組み合わせた別のパスワードにしてください。';
  if(s.includes('password should be at least')||s.includes('password must be at least'))return 'パスワードが短すぎます。8文字以上を目安に設定してください。';
  if(s.includes('unable to validate email')||s.includes('invalid email'))return 'ユーザーIDを変更してもう一度お試しください。';
  if(s.includes('signup is disabled')||s.includes('signups not allowed'))return '現在、新しいアカウントを登録できない設定になっています。';
  if(s.includes('rate limit')||s.includes('too many requests'))return '短時間に操作が繰り返されました。少し待ってからもう一度お試しください。';
  const sec=String(msg).match(/after\s+(\d+)\s+seconds?/i);
  if(sec)return `セキュリティ保護のため、あと${sec[1]}秒ほど待ってからもう一度お試しください。`;
  if(s.includes('network')||s.includes('failed to fetch'))return '通信に失敗しました。電波状況を確認して、もう一度お試しください。';
  return fallback;
}
function loginView(){
  app.innerHTML=`<div class="admin"><div class="login panel"><div class="eyebrow">STAFF ONLY</div><h1>管理画面</h1><p class="muted">登録済みのスタッフアカウントでログインしてください。</p><form id="loginForm" class="fields"><div class="field"><label>ユーザーID</label><input id="loginId" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="例：staff01"></div><div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary">ログイン</button></form><div class="actions"><a class="btn small" href="./" style="text-decoration:none">公開メニュー</a></div><div class="muted" style="margin-top:12px">※既存アカウントの移行前だけ、これまでのメールアドレスでもログインできます。</div><div id="authmsg" class="muted" style="margin-top:12px"></div></div></div>`;
  document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const loginId=document.getElementById('loginId').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('authmsg');msg.textContent='';if(!loginId){msg.textContent='ユーザーIDを入力してください。';return}let email;if(loginId.includes('@'))email=loginId;else{const normalized=normalizeStaffLoginId(loginId);const mapped=staffProfiles().find(p=>!p.isSoldOut&&normalizeStaffLoginId(p.description)===normalized&&isInternalStaffEmail(p.imageUrl||''));email=mapped?.imageUrl||staffEmailFromId(normalized)}try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email,password})});token=r.access_token;localStorage.setItem('queen_admin_token',token);const user=await api('/auth/v1/user',{method:'GET'});await ensureStaffProfile(user);const profile=staffProfiles().find(x=>x.id==='staff-'+user.id);if(profile?.isSoldOut){token='';localStorage.removeItem('queen_admin_token');msg.textContent='このスタッフアカウントは削除されています。';return}toast('ログインしました');adminView()}catch(err){token='';localStorage.removeItem('queen_admin_token');msg.textContent=authErrorJa(err,'ログインできませんでした。入力内容をご確認ください。')}};
}
function registerView(prefillId=''){
  app.innerHTML=`<div class="admin"><div class="login panel"><div class="eyebrow">STAFF REGISTRATION</div><h1>スタッフ登録</h1><p class="muted">スタッフ専用の登録ページです。メールアドレスは不要です。</p><form id="registerForm" class="fields"><div class="field"><label>名前</label><input id="regName" autocomplete="name" required maxlength="50" placeholder="例：無名"></div><div class="field"><label>ユーザーID</label><input id="regLoginId" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(prefillId)}" required maxlength="30" placeholder="例：staff01"><div class="muted" style="margin-top:6px">3〜30文字・空白なし。ログイン時に使用します。</div></div><div class="field"><label>パスワード</label><input id="regPassword" type="password" autocomplete="new-password" minlength="8" required><div class="muted" style="margin-top:6px">8文字以上を目安に、英字・数字・記号を組み合わせてください。</div></div><div class="field"><label>パスワード（確認）</label><input id="regPassword2" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn primary">スタッフアカウントを登録</button></form><div class="actions"><a class="btn small" href="?admin=1" style="text-decoration:none">管理画面へ戻る</a></div><div id="authmsg" class="muted" style="margin-top:12px"></div></div></div>`;
  document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('regName').value.trim(),loginId=normalizeStaffLoginId(document.getElementById('regLoginId').value),p1=document.getElementById('regPassword').value,p2=document.getElementById('regPassword2').value,msg=document.getElementById('authmsg');msg.textContent='';if(!name){msg.textContent='名前を入力してください。';return}if(!validStaffLoginId(loginId)){msg.textContent='ユーザーIDは3〜30文字・空白なしで設定してください。';return}if(p1!==p2){msg.textContent='パスワード（確認）が一致していません。';return}if(p1.length<8){msg.textContent='パスワードは8文字以上で設定してください。';return}if(staffProfiles().some(p=>!p.isSoldOut&&normalizeStaffLoginId(p.description)===loginId)){msg.textContent='このユーザーIDは現在使用されています。別のユーザーIDにしてください。';return}const email=uniqueStaffEmailFromId(loginId),adminToken=token;try{localStorage.setItem('queen_pending_staff',JSON.stringify({loginId,name,email}));const r=await api('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email,password:p1,data:{staff_name:name,full_name:name,staff_login_id:loginId}})});if(!r.access_token)throw new Error('アカウントを作成できませんでした。');token=r.access_token;const user=await api('/auth/v1/user',{method:'GET'});await ensureStaffProfile(user,name,loginId,email);token=adminToken;localStorage.setItem('queen_admin_token',adminToken);toast('スタッフアカウントを登録しました');location.href='?admin=1'}catch(err){token=adminToken;localStorage.setItem('queen_admin_token',adminToken);msg.textContent=authErrorJa(err,'アカウントを登録できませんでした。入力内容をご確認ください。')}};
}
function staffProfiles(){return data.items.filter(i=>i.categoryId===STAFF_CAT_ID).sort((a,b)=>a.sortOrder-b.sortOrder)}
async function ensureStaffProfile(user,forcedName='',forcedLoginId='',forcedAuthEmail=''){
  if(!token||!user?.id)return;
  const authEmail=String(forcedAuthEmail||user.email||'').trim();
  let loginId=forcedLoginId||staffLoginIdOf(user)||'';
  let name=forcedName||user?.user_metadata?.staff_name||user?.user_metadata?.full_name||'';
  try{const pending=JSON.parse(localStorage.getItem('queen_pending_staff')||'null');if(pending){if(!name)name=pending.name||'';if(!loginId)loginId=pending.loginId||''}}catch{}
  if(!name)name=loginId||authEmail.split('@')[0]||'スタッフ';
  let cat=data.categories.find(c=>c.id===STAFF_CAT_ID);
  if(!cat){try{await api('/rest/v1/categories',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:STAFF_CAT_ID,name:STAFF_CAT_NAME,sort_order:9999})})}catch{};await loadData();cat=data.categories.find(c=>c.id===STAFF_CAT_ID)}
  const id='staff-'+user.id;
  let profile=data.items.find(i=>i.id===id);
  const profileLoginId=loginId||(!isInternalStaffEmail(authEmail)?authEmail.split('@')[0]:'');
  if(!profile){await api('/rest/v1/menu_items',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,category_id:STAFF_CAT_ID,name,description:profileLoginId,price:0,image_url:isInternalStaffEmail(authEmail)?authEmail:null,is_visible:false,is_sold_out:false,sort_order:staffProfiles().length})});await loadData();localStorage.removeItem('queen_pending_staff')}
  else if((profileLoginId&&profile.description!==profileLoginId)||(isInternalStaffEmail(authEmail)&&profile.imageUrl!==authEmail)){try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({description:profileLoginId||profile.description,name,image_url:isInternalStaffEmail(authEmail)?authEmail:profile.imageUrl})});await loadData()}catch{}}
}
function visibleAdminCats(cats){return cats.filter(c=>c.id!==STAFF_CAT_ID)}
function adminGroupCats(cats,group){
  const ids={system:['cat-system','cat-shisha','cat-option'],drink:['cat-cocktail','cat-chuhai','cat-whisky','cat-brandy','cat-soft-drink','cat-other-drink','cat-champagne','cat-shot'],shisha:['cat-flavor-fruits','cat-flavor-sweets','cat-flavor-botanical','cat-flavor-spice','cat-flavor-darkleaf','cat-flavor-others','cat-nn-fruits','cat-nn-sweets','cat-nn-others']}[group]||[];
  return visibleAdminCats(cats).filter(c=>ids.includes(c.id));
}
function adminView(tab='items'){if(!token){loginView();return}const cats=[...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder);app.innerHTML=`<div class="admin"><div class="topbar"><div class="brand">QUEEN / ADMIN</div><div><a class="btn small" href="./" style="text-decoration:none">公開メニュー</a> <button id="logout" class="btn small">ログアウト</button></div></div><div class="admin-tabs">${[['items','商品'],['cats','カテゴリ'],['shop','店舗情報'],['qr','QRコード'],['account','アカウント']].map(([id,n])=>`<button class="btn admin-tab ${id===tab?'active':''}" data-atab="${id}">${n}</button>`).join('')}</div><div id="adminBody"></div></div>`;document.getElementById('logout').onclick=()=>{token='';localStorage.removeItem('queen_admin_token');loginView()};document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>adminView(b.dataset.atab));if(tab==='items')renderItems(cats,adminItemGroup);if(tab==='cats')renderCats(visibleAdminCats(cats));if(tab==='shop')renderShop();if(tab==='qr')renderQR();if(tab==='account')renderAccount()}
function renderItems(cats,group='system'){

    const list=data.items.filter(i=>i.categoryId===c.id).sort((a,b)=>a.sortOrder-b.sortOrder);

  }).join('');
  document.querySelectorAll('[data-igroup]').forEach(b=>b.onclick=()=>renderItems(cats,b.dataset.igroup));
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>itemForm(null,b.dataset.add));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>itemForm(data.items.find(i=>i.id===b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.del));
  document.querySelectorAll('[data-visible]').forEach(x=>x.onchange=()=>patchItem(x.dataset.visible,{is_visible:x.checked}));
  document.querySelectorAll('[data-stock]').forEach(x=>x.onclick=async()=>{const i=data.items.find(v=>v.id===x.dataset.stock);if(!i)return;await patchItem(i.id,{is_sold_out:!i.isSoldOut});adminView('items')});
  document.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>moveItem(x.dataset.move,Number(x.dataset.dir)))
}
function itemForm(item,defaultCat){const body=document.getElementById('adminBody');const cats=visibleAdminCats([...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder));body.innerHTML=`<section class="panel"><h2>${item?'商品を編集':'商品を追加'}</h2><form id="itemForm" class="fields"><div class="field"><label>商品名</label><input id="iname" value="${esc(item?.name||'')}" required></div><div class="field"><label>カテゴリ</label><select id="icat">${cats.map(c=>`<option value="${esc(c.id)}" ${(item?.categoryId||defaultCat)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>価格（円）</label><input id="iprice" type="number" min="0" value="${item?.price??''}" required></div><div class="field"><label>説明</label><textarea id="idesc">${esc(item?.description||'')}</textarea></div><div class="actions"><button class="btn primary">保存</button><button type="button" id="cancel" class="btn">戻る</button></div></form></section>`;document.getElementById('cancel').onclick=()=>adminView('items');document.getElementById('itemForm').onsubmit=async e=>{e.preventDefault();const payload={category_id:document.getElementById('icat').value,name:document.getElementById('iname').value.trim(),price:Number(document.getElementById('iprice').value),description:document.getElementById('idesc').value.trim(),is_visible:item?.isVisible??true,is_sold_out:item?.isSoldOut??false,sort_order:item?.sortOrder??data.items.filter(i=>i.categoryId===document.getElementById('icat').value).length};try{if(item)await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});else await api('/rest/v1/menu_items',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({...payload,id:'item-'+Date.now().toString(36)})});await loadData();toast('保存しました');adminView('items')}catch(e){console.error(e);toast('保存に失敗しました')}}}
async function patchItem(id,payload){try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});await loadData();toast('保存しました')}catch{toast('保存に失敗しました');adminView('items')}}

async function moveItem(id,dir){const it=data.items.find(i=>i.id===id),list=data.items.filter(i=>i.categoryId===it.categoryId).sort((a,b)=>a.sortOrder-b.sortOrder),idx=list.findIndex(i=>i.id===id),other=list[idx+dir];if(!other)return;try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:other.sortOrder})});await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(other.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:it.sortOrder})});await loadData();adminView('items');toast('並び順を保存しました')}catch{toast('保存に失敗しました')}}
function renderCats(cats){const body=document.getElementById('adminBody');body.innerHTML=`<section class="panel"><h2>カテゴリ</h2>${cats.map((c,idx)=>`<div class="admin-item"><div class="row"><input class="catname" data-cid="${esc(c.id)}" value="${esc(c.name)}" style="flex:1;background:#151412;border:1px solid rgba(234,223,201,.25);color:var(--ink);border-radius:9px;padding:9px"><div><button class="btn small" data-cmove="${esc(c.id)}" data-dir="-1" ${idx===0?'disabled':''}>↑</button> <button class="btn small" data-cmove="${esc(c.id)}" data-dir="1" ${idx===cats.length-1?'disabled':''}>↓</button> <button class="btn small danger" data-cdel="${esc(c.id)}">削除</button></div></div></div>`).join('')}<form id="catAdd" class="actions"><input id="newcat" placeholder="新しいカテゴリ名" style="flex:1;background:#151412;border:1px solid rgba(234,223,201,.25);color:var(--ink);border-radius:9px;padding:10px"><button class="btn primary">追加</button></form></section>`;document.querySelectorAll('.catname').forEach(x=>x.onchange=async()=>{try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(x.dataset.cid),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({name:x.value.trim()})});await loadData();toast('保存しました')}catch{toast('保存に失敗しました')}});document.getElementById('catAdd').onsubmit=async e=>{e.preventDefault();const n=document.getElementById('newcat').value.trim();if(!n)return;try{await api('/rest/v1/categories',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:'cat-'+Date.now().toString(36),name:n,sort_order:visibleAdminCats(data.categories).length})});await loadData();adminView('cats');toast('追加しました')}catch{toast('追加に失敗しました')}};document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{if(!confirm('カテゴリと所属商品を削除しますか？'))return;try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(b.dataset.cdel),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await loadData();adminView('cats');toast('削除しました')}catch{toast('削除に失敗しました')}});document.querySelectorAll('[data-cmove]').forEach(b=>b.onclick=async()=>{const id=b.dataset.cmove,dir=Number(b.dataset.dir),idx=cats.findIndex(c=>c.id===id),o=cats[idx+dir];if(!o)return;try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:o.sortOrder})});await api('/rest/v1/categories?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:cats[idx].sortOrder})});await loadData();adminView('cats');toast('並び順を保存しました')}catch{toast('保存に失敗しました')}})}

async function renderAccount(){
  const body=document.getElementById('adminBody');
  body.innerHTML='<section class="panel"><div class="loading">アカウント情報を読み込み中...</div></section>';
  try{
    const user=await api('/auth/v1/user',{method:'GET'});await ensureStaffProfile(user);await loadData();const allProfiles=staffProfiles(),profiles=allProfiles.filter(p=>!p.isSoldOut),currentId='staff-'+user.id,current=allProfiles.find(x=>x.id===currentId),currentLoginId=staffLoginIdOf(user)||(!isInternalStaffEmail(user?.email||'')?'未設定':current?.description||''),regUrl=location.origin+location.pathname+'?register=1';
    body.innerHTML=`<section class="panel" style="margin-bottom:14px"><div class="row"><div><h2>スタッフアカウント</h2><p class="muted">登録済みスタッフの一覧です。ログイン中のスタッフなら誰でもアカウントを削除できます。</p></div><button id="openRegister" class="btn small primary">＋スタッフ登録</button></div>${profiles.map(p=>`<div class="staff-card"><div class="row"><div><b>${esc(p.name)}</b></div><button class="btn small danger" data-delete-staff="${esc(p.id)}">削除</button></div></div>`).join('')||'<div class="muted">スタッフ情報がありません。</div>'}<div class="muted" style="margin-top:12px;word-break:break-all">登録ページ：${esc(regUrl)}</div></section><section class="panel"><h2>自分のアカウント設定</h2><form id="nameForm" class="fields"><div class="field"><label>名前</label><input id="staffName" value="${esc(current?.name||user?.user_metadata?.staff_name||'')}" required></div><button class="btn">名前を変更</button></form><hr style="border:0;border-top:1px solid rgba(234,223,201,.18);margin:24px 0"><div class="field"><label>現在のユーザーID</label><input value="${esc(currentLoginId)}" disabled></div><form id="loginIdForm" class="fields" style="margin-top:18px"><div class="field"><label>新しいユーザーID</label><input id="newLoginId" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required><div class="muted" style="margin-top:6px">3〜30文字・空白なし。次回ログインから使用します。</div></div><button class="btn primary">ユーザーIDを変更</button></form><hr style="border:0;border-top:1px solid rgba(234,223,201,.18);margin:24px 0"><form id="passwordForm" class="fields"><div class="field"><label>新しいパスワード</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>新しいパスワード（確認）</label><input id="newPassword2" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn primary">パスワードを変更</button></form><div id="accountMsg" class="muted" style="margin-top:12px"></div></section>`;
    document.getElementById('openRegister').onclick=()=>location.href='?register=1';
    document.querySelectorAll('[data-delete-staff]').forEach(b=>b.onclick=async()=>{const p=profiles.find(x=>x.id===b.dataset.deleteStaff);if(!p)return;if(!confirm(`${p.name} のスタッフアカウントを削除しますか？\n削除後は一覧から消え、このアカウントでは管理画面にログインできなくなります。`))return;try{const targetUserId=p.id.replace(/^staff-/,'');let fullyDeleted=false;try{await api('/rest/v1/rpc/delete_staff_account',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({p_user_id:targetUserId})});fullyDeleted=true}catch{}if(!fullyDeleted){await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_sold_out:true})})}await loadData();toast('アカウントを削除しました');if(p.id===currentId){token='';localStorage.removeItem('queen_admin_token');loginView();return}renderAccount()}catch{toast('アカウントを削除できませんでした')}});
    document.getElementById('nameForm').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('staffName').value.trim();if(!name)return;try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({data:{...(user.user_metadata||{}),staff_name:name,full_name:name}})});if(current)await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(current.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name})});await loadData();toast('名前を変更しました');renderAccount()}catch{toast('名前を変更できませんでした')}};
    document.getElementById('loginIdForm').onsubmit=async e=>{e.preventDefault();const newLoginId=normalizeStaffLoginId(document.getElementById('newLoginId').value);if(!validStaffLoginId(newLoginId)){document.getElementById('accountMsg').textContent='ユーザーIDは3〜30文字・空白なしで設定してください。';return}if(allProfiles.some(p=>p.id!==currentId&&!p.isSoldOut&&normalizeStaffLoginId(p.description)===newLoginId)){document.getElementById('accountMsg').textContent='このユーザーIDは現在使用されています。';return}try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({data:{...(user.user_metadata||{}),staff_login_id:newLoginId}})});if(current)await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(current.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({description:newLoginId})});await loadData();document.getElementById('accountMsg').textContent='ユーザーIDを変更しました。次回から新しいユーザーIDでログインしてください。';toast('ユーザーIDを変更しました');renderAccount()}catch(err){document.getElementById('accountMsg').textContent=authErrorJa(err,'ユーザーIDを変更できませんでした。')}};
    document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const p1=document.getElementById('newPassword').value,p2=document.getElementById('newPassword2').value;if(p1.length<8){toast('パスワードは8文字以上にしてください');return}if(p1!==p2){toast('確認用パスワードが一致しません');return}try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:p1})});document.getElementById('newPassword').value='';document.getElementById('newPassword2').value='';document.getElementById('accountMsg').textContent='パスワードを変更しました。';toast('パスワードを変更しました')}catch(err){document.getElementById('accountMsg').textContent=authErrorJa(err,'パスワードを変更できませんでした。')}};
  }catch(err){console.error(err);body.innerHTML='<section class="panel"><div class="error">アカウント情報を取得できませんでした。再ログインしてください。<div class="actions"><button id="relogin" class="btn primary">再ログイン</button></div></div></section>';document.getElementById('relogin').onclick=()=>{token='';localStorage.removeItem('queen_admin_token');loginView()}}
}
async function start(){const params=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.replace(/^#/,'')||'');const hashToken=hash.get('access_token');if(hashToken){token=hashToken;localStorage.setItem('queen_admin_token',token);history.replaceState(null,'',location.pathname+location.search)}await loadData();if(params.get('register')==='1'){registerView();return}if(params.get('admin')==='1'){if(token){try{const user=await api('/auth/v1/user',{method:'GET'});await ensureStaffProfile(user);await loadData();const profile=staffProfiles().find(x=>x.id==='staff-'+user.id);if(profile?.isSoldOut){token='';localStorage.removeItem('queen_admin_token');loginView();const msg=document.getElementById('authmsg');if(msg)msg.textContent='このスタッフアカウントは削除されています。';return}adminView()}catch{token='';localStorage.removeItem('queen_admin_token');loginView()}}else loginView()}else publicView()}

start();
</script>
