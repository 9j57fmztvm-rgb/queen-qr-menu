one;transition:.22s;background:#f1e6d3;color:#171614;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100vw - 32px);text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.login{max-width:390px;margin:10vh auto 0}.login h1{font-size:30px}.qrbox{text-align:center}.qrbox canvas,.qrbox img{max-width:260px;width:100%;background:#fff;padding:12px;border-radius:12px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.two{grid-template-columns:1fr}.admin{padding-left:12px;padding-right:12px}.wrap{padding-left:12px;padding-right:12px}}

['whisky-highball','cat-whisky','ハイボール','',800],['whisky-ginger','cat-whisky','ジンジャーハイ','',800],['whisky-coke','cat-whisky','コークハイ','',800],
['brandy-rock-water','cat-brandy','ロック・水割り','',800],['brandy-soda','cat-brandy','ソーダ割り','',800]

let data=structuredClone(FALLBACK), activeCat='cat-system', token=localStorage.getItem('queen_admin_token')||'';
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')+'-'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),1800)}
async function api(path,opt={}){const headers={'apikey':API_KEY,'Content-Type':'application/json',...(opt.headers||{})};if(opt.auth!==false&&token)headers['Authorization']='Bearer '+token;const res=await fetch(SUPABASE_URL+path,{...opt,headers});if(!res.ok){let t=await res.text();throw new Error(t||res.statusText)}if(res.status===204)return null;const txt=await res.text();return txt?JSON.parse(txt):null}
async function loadData(){try{const bust='&_='+Date.now();const [s,c,m]=await Promise.all([api('/rest/v1/shop_info?id=eq.default&select=*'+bust,{auth:false}),api('/rest/v1/categories?select=*&order=sort_order.asc'+bust,{auth:false}),api('/rest/v1/menu_items?select=*&order=sort_order.asc'+bust,{auth:false})]);if(s?.[0])data.shop={name:s[0].name,description:s[0].description,hours:s[0].hours,notes:s[0].notes,announcement:s[0].announcement};if(c?.length)data.categories=c.map(x=>({id:x.id,name:x.name,sortOrder:x.sort_order}));if(m?.length)data.items=m.map(x=>({id:x.id,categoryId:x.category_id,name:x.name,description:x.description,price:x.price,imageUrl:x.image_url,isVisible:x.is_visible,isSoldOut:x.is_sold_out,sortOrder:x.sort_order}));}catch(e){console.warn(e);toast('オンラインデータを取得できないため、保存済みメニューを表示しています');}}
function publicView(){const cats=[...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder);if(!cats.some(c=>c.id===activeCat))activeCat=cats[0]?.id||'';const items=data.items.filter(i=>i.categoryId===activeCat&&i.isVisible).sort((a,b)=>a.sortOrder-b.sortOrder);app.innerHTML=`<div class="wrap"><div class="frame"><section class="hero"><div class="eyebrow">MENU</div><h1>${esc(data.shop.name)}</h1><div class="hours">open ${esc((data.shop.hours||'').split('-')[0]?.trim()||'19:00')}<br>close ${esc((data.shop.hours||'').split('-')[1]?.trim()||'5:00')}</div>${data.shop.announcement?`<div class="notice">${esc(data.shop.announcement)}</div>`:''}</section></div><nav class="tabs">${cats.map(c=>`<button class="tab ${c.id===activeCat?'active':''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</nav><h2 class="section-title">${esc(cats.find(c=>c.id===activeCat)?.name||'MENU')}</h2><section>${items.length?items.map(i=>`<article class="card"><div class="row"><div class="name">${esc(i.name)}${i.isSoldOut?'<span class="sold">売り切れ</span>':''}</div><div class="price">${yen(i.price)}</div></div>${i.description?`<div class="desc">${esc(i.description)}</div>`:''}</article>`).join(''):'<div class="empty">このカテゴリは準備中です。</div>'}</section><footer class="footer">${esc(data.shop.notes||'tax10%頂戴しております。')}<br><span style="opacity:.35">menu v2</span><br><br><a href="?admin=1" style="color:#777;text-decoration:none;font-size:10px">STAFF</a></footer></div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;publicView()})}
function loginView(){app.innerHTML=`<div class="admin"><div class="login panel"><div class="eyebrow">STAFF ONLY</div><h1>管理画面</h1><p class="muted">メールアドレスとパスワードでログインしてください。</p><form id="loginForm" class="fields"><div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div><button class="btn primary">ログイン</button></form><div class="actions"><button id="signup" class="btn small">初回アカウント作成</button><a class="btn small" href="./" style="text-decoration:none">公開メニュー</a></div><div id="authmsg" class="muted" style="margin-top:12px"></div></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email,password})});token=r.access_token;localStorage.setItem('queen_admin_token',token);toast('ログインしました');adminView()}catch{document.getElementById('authmsg').textContent='ログインできませんでした。メールアドレスまたはパスワードをご確認ください。'}};document.getElementById('signup').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){toast('メールアドレスと6文字以上のパスワードを入力してください');return}try{const r=await api('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email,password})});if(r.access_token){token=r.access_token;localStorage.setItem('queen_admin_token',token);toast('アカウントを作成しました');adminView()}else{document.getElementById('authmsg').textContent='確認メールを送信しました。メール内のリンクを開いてからログインしてください。'}}catch{document.getElementById('authmsg').textContent='アカウントを作成できませんでした。既に登録済みの可能性があります。'}}}
function adminView(tab='items'){if(!token){loginView();return}const cats=[...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder);app.innerHTML=`<div class="admin"><div class="topbar"><div class="brand">QUEEN / ADMIN</div><div><a class="btn small" href="./" style="text-decoration:none">公開メニュー</a> <button id="logout" class="btn small">ログアウト</button></div></div><div class="admin-tabs">${[['items','商品'],['cats','カテゴリ'],['shop','店舗情報'],['qr','QRコード']].map(([id,n])=>`<button class="btn admin-tab ${id===tab?'active':''}" data-atab="${id}">${n}</button>`).join('')}</div><div id="adminBody"></div></div>`;document.getElementById('logout').onclick=()=>{token='';localStorage.removeItem('queen_admin_token');loginView()};document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>adminView(b.dataset.atab));if(tab==='items')renderItems(cats);if(tab==='cats')renderCats(cats);if(tab==='shop')renderShop();if(tab==='qr')renderQR()}
function renderItems(cats){const body=document.getElementById('adminBody');body.innerHTML=cats.map(c=>{const list=data.items.filter(i=>i.categoryId===c.id).sort((a,b)=>a.sortOrder-b.sortOrder);return `<section class="panel" style="margin-bottom:14px"><div class="row"><h2>${esc(c.name)}</h2><button class="btn small primary" data-add="${esc(c.id)}">＋追加</button></div>${list.map((i,idx)=>`<div class="admin-item"><div class="row"><div><b>${esc(i.name)}</b><div class="meta">${yen(i.price)}${i.description?' / '+esc(i.description):''}</div></div><div><button class="btn small" data-edit="${esc(i.id)}">編集</button> <button class="btn small danger" data-del="${esc(i.id)}">削除</button></div></div><div class="switchline"><label><input type="checkbox" data-visible="${esc(i.id)}" ${i.isVisible?'checked':''}> 表示</label><label><input type="checkbox" data-sold="${esc(i.id)}" ${i.isSoldOut?'checked':''}> 売り切れ</label><button class="btn small" data-move="${esc(i.id)}" data-dir="-1" ${idx===0?'disabled':''}>↑</button><button class="btn small" data-move="${esc(i.id)}" data-dir="1" ${idx===list.length-1?'disabled':''}>↓</button></div></div>`).join('')||'<div class="muted">商品がありません。</div>'}</section>`}).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>itemForm(null,b.dataset.add));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>itemForm(data.items.find(i=>i.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.del));document.querySelectorAll('[data-visible]').forEach(x=>x.onchange=()=>patchItem(x.dataset.visible,{is_visible:x.checked}));document.querySelectorAll('[data-sold]').forEach(x=>x.onchange=()=>patchItem(x.dataset.sold,{is_sold_out:x.checked}));document.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>moveItem(x.dataset.move,Number(x.dataset.dir)))}
function itemForm(item,defaultCat){const body=document.getElementById('adminBody');const cats=[...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder);body.innerHTML=`<section class="panel"><h2>${item?'商品を編集':'商品を追加'}</h2><form id="itemForm" class="fields"><div class="field"><label>商品名</label><input id="iname" value="${esc(item?.name||'')}" required></div><div class="field"><label>カテゴリ</label><select id="icat">${cats.map(c=>`<option value="${esc(c.id)}" ${(item?.categoryId||defaultCat)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>価格（円）</label><input id="iprice" type="number" min="0" value="${item?.price??''}" required></div><div class="field"><label>説明</label><textarea id="idesc">${esc(item?.description||'')}</textarea></div><div class="actions"><button class="btn primary">保存</button><button type="button" id="cancel" class="btn">戻る</button></div></form></section>`;document.getElementById('cancel').onclick=()=>adminView('items');document.getElementById('itemForm').onsubmit=async e=>{e.preventDefault();const payload={category_id:document.getElementById('icat').value,name:document.getElementById('iname').value.trim(),price:Number(document.getElementById('iprice').value),description:document.getElementById('idesc').value.trim(),is_visible:item?.isVisible??true,is_sold_out:item?.isSoldOut??false,sort_order:item?.sortOrder??data.items.filter(i=>i.categoryId===document.getElementById('icat').value).length};try{if(item)await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});else await api('/rest/v1/menu_items',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({...payload,id:'item-'+Date.now().toString(36)})});await loadData();toast('保存しました');adminView('items')}catch(e){console.error(e);toast('保存に失敗しました')}}}
async function patchItem(id,payload){try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});await loadData();toast('保存しました')}catch{toast('保存に失敗しました');adminView('items')}}
async function deleteItem(id){if(!confirm('この商品を削除しますか？'))return;try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await loadData();toast('削除しました');adminView('items')}catch{toast('削除に失敗しました')}}
async function moveItem(id,dir){const it=data.items.find(i=>i.id===id),list=data.items.filter(i=>i.categoryId===it.categoryId).sort((a,b)=>a.sortOrder-b.sortOrder),idx=list.findIndex(i=>i.id===id),other=list[idx+dir];if(!other)return;try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:other.sortOrder})});await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(other.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:it.sortOrder})});await loadData();adminView('items');toast('並び順を保存しました')}catch{toast('保存に失敗しました')}}
function renderCats(cats){const body=document.getElementById('adminBody');body.innerHTML=`<section class="panel"><h2>カテゴリ</h2>${cats.map((c,idx)=>`<div class="admin-item"><div class="row"><input class="catname" data-cid="${esc(c.id)}" value="${esc(c.name)}" style="flex:1;background:#151412;border:1px solid rgba(234,223,201,.25);color:var(--ink);border-radius:9px;padding:9px"><div><button class="btn small" data-cmove="${esc(c.id)}" data-dir="-1" ${idx===0?'disabled':''}>↑</button> <button class="btn small" data-cmove="${esc(c.id)}" data-dir="1" ${idx===cats.length-1?'disabled':''}>↓</button> <button class="btn small danger" data-cdel="${esc(c.id)}">削除</button></div></div></div>`).join('')}<form id="catAdd" class="actions"><input id="newcat" placeholder="新しいカテゴリ名" style="flex:1;background:#151412;border:1px solid rgba(234,223,201,.25);color:var(--ink);border-radius:9px;padding:10px"><button class="btn primary">追加</button></form></section>`;document.querySelectorAll('.catname').forEach(x=>x.onchange=async()=>{try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(x.dataset.cid),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({name:x.value.trim()})});await loadData();toast('保存しました')}catch{toast('保存に失敗しました')}});document.getElementById('catAdd').onsubmit=async e=>{e.preventDefault();const n=document.getElementById('newcat').value.trim();if(!n)return;try{await api('/rest/v1/categories',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:'cat-'+Date.now().toString(36),name:n,sort_order:cats.length})});await loadData();adminView('cats');toast('追加しました')}catch{toast('追加に失敗しました')}};document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{if(!confirm('カテゴリと所属商品を削除しますか？'))return;try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(b.dataset.cdel),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await loadData();adminView('cats');toast('削除しました')}catch{toast('削除に失敗しました')}});document.querySelectorAll('[data-cmove]').forEach(b=>b.onclick=async()=>{const id=b.dataset.cmove,dir=Number(b.dataset.dir),idx=cats.findIndex(c=>c.id===id),o=cats[idx+dir];if(!o)return;try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:o.sortOrder})});await api('/rest/v1/categories?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:cats[idx].sortOrder})});await loadData();adminView('cats');toast('並び順を保存しました')}catch{toast('保存に失敗しました')}})}
function renderShop(){const s=data.shop,body=document.getElementById('adminBody');body.innerHTML=`<section class="panel"><h2>店舗情報</h2><form id="shopForm" class="fields"><div class="field"><label>店名</label><input id="sname" value="${esc(s.name)}"></div><div class="field"><label>営業時間</label><input id="shours" value="${esc(s.hours)}"></div><div class="field"><label>店舗説明</label><textarea id="sdesc">${esc(s.description||'')}</textarea></div><div class="field"><label>注意書き</label><textarea id="snotes">${esc(s.notes||'')}</textarea></div><div class="field"><label>お知らせ</label><textarea id="sann">${esc(s.announcement||'')}</textarea></div><button class="btn primary">保存</button></form></section>`;document.getElementById('shopForm').onsubmit=async e=>{e.preventDefault();try{await api('/rest/v1/shop_info?id=eq.default',{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({name:document.getElementById('sname').value.trim(),hours:document.getElementById('shours').value.trim(),description:document.getElementById('sdesc').value.trim(),notes:document.getElementById('snotes').value.trim(),announcement:document.getElementById('sann').value.trim(),updated_at:new Date().toISOString()})});await loadData();toast('店舗情報を保存しました')}catch{toast('保存に失敗しました')}}}
function renderQR(){const body=document.getElementById('adminBody');const url=location.origin+location.pathname;body.innerHTML=`<section class="panel qrbox"><h2>公開メニューQR</h2><canvas id="qr"></canvas><p class="muted" style="word-break:break-all">${esc(url)}</p><button id="copyurl" class="btn">URLをコピー</button></section>`;if(window.QRCode)QRCode.toCanvas(document.getElementById('qr'),url,{width:300,margin:2,color:{dark:'#161513',light:'#ffffff'}}).catch(()=>{});document.getElementById('copyurl').onclick=async()=>{await navigator.clipboard.writeText(url);toast('URLをコピーしました')}}
async function start(){const params=new URLSearchParams(location.search);await loadData();if(params.get('admin')==='1'){if(token)adminView();else loginView()}else publicView()}
start();
</script>
