  const flavorItem=i=>`<div class="flavor-item">${esc(i.name)}${i.isSoldOut?'<span class="sold">売り切れ</span>':''}</div>`;
  const section=(id,label,compact=false)=>{
    const c=cats.find(x=>x.id===id); if(!c)return '';
    const items=data.items.filter(i=>i.categoryId===id&&i.isVisible).sort((a,b)=>a.sortOrder-b.sortOrder); if(!items.length)return '';
    return `<h2 class="section-title">${esc(label||c.name)}</h2>${compact?`<section class="flavor-grid">${items.map(flavorItem).join('')}</section>`:`<section>${items.map(card).join('')}</section>`}`;
  };

  let content='';
  if(activeMain==='main-system'){
    if(activeSub==='sys-charge') content=section('cat-system','SYSTEM');
    if(activeSub==='sys-shisha') content=section('cat-shisha','Shisha');
    if(activeSub==='sys-option') content=section('cat-option','Option');
    if(!content)content='<div class="empty">このメニューは準備中です。</div>';
  }else if(activeMain==='main-drink'){
    if(activeSub==='drink-alcohol') content=alcoholIds.map(id=>section(id)).join('');
    if(activeSub==='drink-soft') content=section('cat-soft-drink','ソフトドリンク');
    if(activeSub==='drink-other') content=section('cat-other-drink','Otherドリンク');
    if(activeSub==='drink-champagne') content=section('cat-champagne','シャンパン');
    if(!content)content='<div class="empty">ドリンクメニューは準備中です。</div>';
  }else if(activeMain==='main-shisha'){
    const labels={
      'cat-flavor-fruits':'FRUITS','cat-flavor-sweets':'SWEETS','cat-flavor-botanical':'BOTANICAL&TEA','cat-flavor-spice':'SPICE&OTHERS','cat-flavor-darkleaf':'DARK LEAF','cat-flavor-others':'OTHERS',
      'cat-nn-fruits':'FRUITS','cat-nn-sweets':'SWEETS','cat-nn-others':'OTHERS'
    };
    if(activeSub==='shisha-nicotine') content=flavorIds.map(id=>section(id,labels[id],true)).join('');
    if(activeSub==='shisha-nonnicotine') content=nonNicotineIds.map(id=>section(id,labels[id],true)).join('');
    if(!content)content='<div class="empty">シーシャフレーバーは準備中です。</div>';
  }

  const sub=(subTabs[activeMain]||[]);
  app.innerHTML=`<div class="wrap"><div class="frame"><section class="hero"><div class="eyebrow">MENU</div><h1>${esc(data.shop.name)}</h1><div class="hours">open ${esc((data.shop.hours||'').split('-')[0]?.trim()||'19:00')}<br>close ${esc((data.shop.hours||'').split('-')[1]?.trim()||'5:00')}</div>${data.shop.announcement?`<div class="notice">${esc(data.shop.announcement)}</div>`:''}</section></div><nav class="tabs">${mainTabs.map(t=>`<button class="tab ${t.id===activeMain?'active':''}" data-main="${t.id}">${t.name}</button>`).join('')}</nav><nav class="subtabs">${sub.map(t=>`<button class="subtab ${t.id===activeSub?'active':''}" data-sub="${t.id}">${t.name}</button>`).join('')}</nav>${content}<footer class="footer">${esc(data.shop.notes||'tax10%頂戴しております。')}<br><span style="opacity:.35">menu v7</span><br><br><a href="?admin=1" style="color:#777;text-decoration:none;font-size:10px">STAFF</a></footer></div>`;
  document.querySelectorAll('[data-main]').forEach(b=>b.onclick=()=>{activeMain=b.dataset.main;activeSub=(subTabs[activeMain]||[])[0]?.id||'';publicView()});
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{activeSub=b.dataset.sub;publicView()});
}
function loginView(){
  app.innerHTML=`<div class="admin"><div class="login panel"><div class="eyebrow">STAFF ONLY</div><h1>管理画面</h1><p class="muted">メールアドレスとパスワードでログインしてください。</p><form id="loginForm" class="fields"><div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div><button class="btn primary">ログイン</button></form><div class="actions"><button id="signup" class="btn small">初回アカウント作成</button><a class="btn small" href="./" style="text-decoration:none">公開メニュー</a></div><div id="authmsg" class="muted" style="margin-top:12px"></div></div></div>`;
  document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email,password})});token=r.access_token;localStorage.setItem('queen_admin_token',token);toast('ログインしました');adminView()}catch{document.getElementById('authmsg').textContent='ログインできませんでした。メールアドレスまたはパスワードをご確認ください。'}};
  document.getElementById('signup').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){toast('メールアドレスと6文字以上のパスワードを入力してください');return}try{const r=await api('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email,password})});if(r.access_token){token=r.access_token;localStorage.setItem('queen_admin_token',token);toast('アカウントを作成しました');adminView()}else{document.getElementById('authmsg').textContent='確認メールを送信しました。メール内のリンクを開いてからログインしてください。'}}catch{document.getElementById('authmsg').textContent='アカウントを作成できませんでした。既に登録済みの可能性があります。'}};
}
function adminView(tab='items'){if(!token){loginView();return}const cats=[...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder);app.innerHTML=`<div class="admin"><div class="topbar"><div class="brand">QUEEN / ADMIN</div><div><a class="btn small" href="./" style="text-decoration:none">公開メニュー</a> <button id="logout" class="btn small">ログアウト</button></div></div><div class="admin-tabs">${[['items','商品'],['cats','カテゴリ'],['shop','店舗情報'],['qr','QRコード'],['account','アカウント']].map(([id,n])=>`<button class="btn admin-tab ${id===tab?'active':''}" data-atab="${id}">${n}</button>`).join('')}</div><div id="adminBody"></div></div>`;document.getElementById('logout').onclick=()=>{token='';localStorage.removeItem('queen_admin_token');loginView()};document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>adminView(b.dataset.atab));if(tab==='items')renderItems(cats);if(tab==='cats')renderCats(cats);if(tab==='shop')renderShop();if(tab==='qr')renderQR();if(tab==='account')renderAccount()}
function renderItems(cats){
  const body=document.getElementById('adminBody');
  body.innerHTML=cats.map(c=>{
    const list=data.items.filter(i=>i.categoryId===c.id).sort((a,b)=>a.sortOrder-b.sortOrder);
    return `<section class="panel" style="margin-bottom:14px"><div class="row"><h2>${esc(c.name)}</h2><button class="btn small primary" data-add="${esc(c.id)}">＋追加</button></div>${list.map((i,idx)=>`<div class="admin-item"><div class="row"><div><b>${esc(i.name)}</b><div class="meta">${Number(i.price)>0?yen(i.price):''}${i.description?(Number(i.price)>0?' / ':'')+esc(i.description):''}</div></div><div><button class="btn small" data-edit="${esc(i.id)}">編集</button> <button class="btn small danger" data-del="${esc(i.id)}">削除</button></div></div><button class="stock-btn ${i.isSoldOut?'out':'in'}" data-stock="${esc(i.id)}">${i.isSoldOut?'🔴 品切れ':'🟢 在庫あり'}</button><div class="switchline"><label><input type="checkbox" data-visible="${esc(i.id)}" ${i.isVisible?'checked':''}> メニューに表示</label><button class="btn small" data-move="${esc(i.id)}" data-dir="-1" ${idx===0?'disabled':''}>↑</button><button class="btn small" data-move="${esc(i.id)}" data-dir="1" ${idx===list.length-1?'disabled':''}>↓</button></div></div>`).join('')||'<div class="muted">商品がありません。</div>'}</section>`
  }).join('');
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>itemForm(null,b.dataset.add));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>itemForm(data.items.find(i=>i.id===b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.del));
  document.querySelectorAll('[data-visible]').forEach(x=>x.onchange=()=>patchItem(x.dataset.visible,{is_visible:x.checked}));
  document.querySelectorAll('[data-stock]').forEach(x=>x.onclick=async()=>{const i=data.items.find(v=>v.id===x.dataset.stock);if(!i)return;await patchItem(i.id,{is_sold_out:!i.isSoldOut});adminView('items')});
  document.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>moveItem(x.dataset.move,Number(x.dataset.dir)))
}
function itemForm(item,defaultCat){const body=document.getElementById('adminBody');const cats=[...data.categories].sort((a,b)=>a.sortOrder-b.sortOrder);body.innerHTML=`<section class="panel"><h2>${item?'商品を編集':'商品を追加'}</h2><form id="itemForm" class="fields"><div class="field"><label>商品名</label><input id="iname" value="${esc(item?.name||'')}" required></div><div class="field"><label>カテゴリ</label><select id="icat">${cats.map(c=>`<option value="${esc(c.id)}" ${(item?.categoryId||defaultCat)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>価格（円）</label><input id="iprice" type="number" min="0" value="${item?.price??''}" required></div><div class="field"><label>説明</label><textarea id="idesc">${esc(item?.description||'')}</textarea></div><div class="actions"><button class="btn primary">保存</button><button type="button" id="cancel" class="btn">戻る</button></div></form></section>`;document.getElementById('cancel').onclick=()=>adminView('items');document.getElementById('itemForm').onsubmit=async e=>{e.preventDefault();const payload={category_id:document.getElementById('icat').value,name:document.getElementById('iname').value.trim(),price:Number(document.getElementById('iprice').value),description:document.getElementById('idesc').value.trim(),is_visible:item?.isVisible??true,is_sold_out:item?.isSoldOut??false,sort_order:item?.sortOrder??data.items.filter(i=>i.categoryId===document.getElementById('icat').value).length};try{if(item)await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});else await api('/rest/v1/menu_items',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({...payload,id:'item-'+Date.now().toString(36)})});await loadData();toast('保存しました');adminView('items')}catch(e){console.error(e);toast('保存に失敗しました')}}}
async function patchItem(id,payload){try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});await loadData();toast('保存しました')}catch{toast('保存に失敗しました');adminView('items')}}
async function deleteItem(id){if(!confirm('この商品を削除しますか？'))return;try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await loadData();toast('削除しました');adminView('items')}catch{toast('削除に失敗しました')}}
async function moveItem(id,dir){const it=data.items.find(i=>i.id===id),list=data.items.filter(i=>i.categoryId===it.categoryId).sort((a,b)=>a.sortOrder-b.sortOrder),idx=list.findIndex(i=>i.id===id),other=list[idx+dir];if(!other)return;try{await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:other.sortOrder})});await api('/rest/v1/menu_items?id=eq.'+encodeURIComponent(other.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:it.sortOrder})});await loadData();adminView('items');toast('並び順を保存しました')}catch{toast('保存に失敗しました')}}
function renderCats(cats){const body=document.getElementById('adminBody');body.innerHTML=`<section class="panel"><h2>カテゴリ</h2>${cats.map((c,idx)=>`<div class="admin-item"><div class="row"><input class="catname" data-cid="${esc(c.id)}" value="${esc(c.name)}" style="flex:1;background:#151412;border:1px solid rgba(234,223,201,.25);color:var(--ink);border-radius:9px;padding:9px"><div><button class="btn small" data-cmove="${esc(c.id)}" data-dir="-1" ${idx===0?'disabled':''}>↑</button> <button class="btn small" data-cmove="${esc(c.id)}" data-dir="1" ${idx===cats.length-1?'disabled':''}>↓</button> <button class="btn small danger" data-cdel="${esc(c.id)}">削除</button></div></div></div>`).join('')}<form id="catAdd" class="actions"><input id="newcat" placeholder="新しいカテゴリ名" style="flex:1;background:#151412;border:1px solid rgba(234,223,201,.25);color:var(--ink);border-radius:9px;padding:10px"><button class="btn primary">追加</button></form></section>`;document.querySelectorAll('.catname').forEach(x=>x.onchange=async()=>{try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(x.dataset.cid),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({name:x.value.trim()})});await loadData();toast('保存しました')}catch{toast('保存に失敗しました')}});document.getElementById('catAdd').onsubmit=async e=>{e.preventDefault();const n=document.getElementById('newcat').value.trim();if(!n)return;try{await api('/rest/v1/categories',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:'cat-'+Date.now().toString(36),name:n,sort_order:cats.length})});await loadData();adminView('cats');toast('追加しました')}catch{toast('追加に失敗しました')}};document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{if(!confirm('カテゴリと所属商品を削除しますか？'))return;try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(b.dataset.cdel),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await loadData();adminView('cats');toast('削除しました')}catch{toast('削除に失敗しました')}});document.querySelectorAll('[data-cmove]').forEach(b=>b.onclick=async()=>{const id=b.dataset.cmove,dir=Number(b.dataset.dir),idx=cats.findIndex(c=>c.id===id),o=cats[idx+dir];if(!o)return;try{await api('/rest/v1/categories?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:o.sortOrder})});await api('/rest/v1/categories?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({sort_order:cats[idx].sortOrder})});await loadData();adminView('cats');toast('並び順を保存しました')}catch{toast('保存に失敗しました')}})}
function renderShop(){const s=data.shop,body=document.getElementById('adminBody');body.innerHTML=`<section class="panel"><h2>店舗情報</h2><form id="shopForm" class="fields"><div class="field"><label>店名</label><input id="sname" value="${esc(s.name)}"></div><div class="field"><label>営業時間</label><input id="shours" value="${esc(s.hours)}"></div><div class="field"><label>店舗説明</label><textarea id="sdesc">${esc(s.description||'')}</textarea></div><div class="field"><label>注意書き</label><textarea id="snotes">${esc(s.notes||'')}</textarea></div><div class="field"><label>お知らせ</label><textarea id="sann">${esc(s.announcement||'')}</textarea></div><button class="btn primary">保存</button></form></section>`;document.getElementById('shopForm').onsubmit=async e=>{e.preventDefault();try{await api('/rest/v1/shop_info?id=eq.default',{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({name:document.getElementById('sname').value.trim(),hours:document.getElementById('shours').value.trim(),description:document.getElementById('sdesc').value.trim(),notes:document.getElementById('snotes').value.trim(),announcement:document.getElementById('sann').value.trim(),updated_at:new Date().toISOString()})});await loadData();toast('店舗情報を保存しました')}catch{toast('保存に失敗しました')}}}
function renderQR(){const body=document.getElementById('adminBody');const url=location.origin+location.pathname;body.innerHTML=`<section class="panel qrbox"><h2>公開メニューQR</h2><canvas id="qr"></canvas><p class="muted" style="word-break:break-all">${esc(url)}</p><button id="copyurl" class="btn">URLをコピー</button></section>`;if(window.QRCode)QRCode.toCanvas(document.getElementById('qr'),url,{width:300,margin:2,color:{dark:'#161513',light:'#ffffff'}}).catch(()=>{});document.getElementById('copyurl').onclick=async()=>{await navigator.clipboard.writeText(url);toast('URLをコピーしました')}}
async function renderAccount(){
  const body=document.getElementById('adminBody');
  body.innerHTML='<section class="panel"><div class="loading">アカウント情報を読み込み中...</div></section>';
  try{
    const user=await api('/auth/v1/user',{method:'GET'});
    const email=user?.email||'';
    body.innerHTML=`<section class="panel"><h2>アカウント設定</h2><p class="muted">管理画面にログインするメールアドレスとパスワードを、ログイン後に変更できます。</p><div class="field"><label>現在のメールアドレス</label><input value="${esc(email)}" disabled></div><form id="emailForm" class="fields" style="margin-top:18px"><div class="field"><label>新しいメールアドレス</label><input id="newEmail" type="email" autocomplete="email" required></div><button class="btn primary">メールアドレスを変更</button></form><hr style="border:0;border-top:1px solid rgba(234,223,201,.18);margin:24px 0"><form id="passwordForm" class="fields"><div class="field"><label>新しいパスワード</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label>新しいパスワード（確認）</label><input id="newPassword2" type="password" autocomplete="new-password" minlength="6" required></div><button class="btn primary">パスワードを変更</button></form><div id="accountMsg" class="muted" style="margin-top:12px"></div></section>`;
    document.getElementById('emailForm').onsubmit=async e=>{e.preventDefault();const newEmail=document.getElementById('newEmail').value.trim();if(!newEmail)return;try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({email:newEmail})});document.getElementById('accountMsg').textContent='メールアドレス変更を受け付けました。確認メールが届いた場合は、メール内のリンクを開いて変更を完了してください。';toast('メールアドレス変更を受け付けました')}catch(err){console.error(err);document.getElementById('accountMsg').textContent='メールアドレスを変更できませんでした。';toast('変更に失敗しました')}};
    document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const p1=document.getElementById('newPassword').value,p2=document.getElementById('newPassword2').value;if(p1.length<6){toast('パスワードは6文字以上にしてください');return}if(p1!==p2){toast('確認用パスワードが一致しません');return}try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:p1})});document.getElementById('newPassword').value='';document.getElementById('newPassword2').value='';document.getElementById('accountMsg').textContent='パスワードを変更しました。';toast('パスワードを変更しました')}catch(err){console.error(err);document.getElementById('accountMsg').textContent='パスワードを変更できませんでした。再ログインしてからお試しください。';toast('変更に失敗しました')}};
  }catch(err){console.error(err);body.innerHTML='<section class="panel"><div class="error">アカウント情報を取得できませんでした。セッションの有効期限が切れている可能性があります。<div class="actions"><button id="relogin" class="btn primary">再ログイン</button></div></div></section>';document.getElementById('relogin').onclick=()=>{token='';localStorage.removeItem('queen_admin_token');loginView()}}
}
async function start(){const params=new URLSearchParams(location.search);await loadData();if(params.get('admin')==='1'){if(token)adminView();else loginView()}else publicView()}
start();
</script>
